# Publish the image when develop (staging) or main (production) moves.
# The server watches these channel tags and deploys new versions itself.
name: release
on:
  push:
    branches: [develop, main]
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/emutel-gh/wagga-futsal   # explicit: github.repository would give "wagga-futsal--"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=
      - id: v
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.short }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          echo "Published \`${IMAGE}:${GITHUB_REF_NAME}\` = version \`${{ steps.v.outputs.short }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "The ${GITHUB_REF_NAME} site picks it up within a few minutes; check the footer version." >> "$GITHUB_STEP_SUMMARY"
