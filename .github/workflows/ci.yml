# Required check for merging into develop and main (the ruleset looks for a job named "ci").
name: ci
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (incl. migration runner against Postgres)
        run: npm test

      - uses: docker/setup-buildx-action@v3
      - name: Docker build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: wagga-futsal:ci
          build-args: |
            APP_VERSION=ci
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the deployer's migration step works inside the real image:
      # `pg` resolves from the standalone node_modules, and on a database shaped
      # like production (schema already there) it records the baseline and
      # applies nothing that's already applied.
      - name: Migration runner works inside the image
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/prodshape
        run: |
          psql "postgresql://postgres:ci@localhost:5432/postgres" -c "CREATE DATABASE prodshape"
          npx prisma db push
          out=$(docker run --rm --network host -e DATABASE_URL="postgresql://postgres:ci@127.0.0.1:5432/prodshape" wagga-futsal:ci node scripts/migrate.mjs)
          echo "$out"
          baseline=$(grep -v '^#' prisma/manual-migrations/_baseline.txt | grep -c .)
          echo "$out" | grep -q "baseline: recorded $baseline file(s)"
          again=$(docker run --rm --network host -e DATABASE_URL="postgresql://postgres:ci@127.0.0.1:5432/prodshape" wagga-futsal:ci node scripts/migrate.mjs)
          echo "$again"
          echo "$again" | grep -q "up to date"

      - name: Image serves /api/health
        run: |
          docker run -d --name app --network host -e PORT=3999 -e DATABASE_URL="postgresql://postgres:ci@127.0.0.1:5432/prodshape" -e STRIPE_SECRET_KEY=sk_test_ci -e APP_URL=http://localhost:3999 wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3999/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:3999/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:3999/api/health | grep -q '"version":"ci"'
          docker rm -f app

      # Staging gate (proxy.ts): with APP_ENV=staging only an active ADMIN's
      # real session gets in; production must behave exactly as before.
      - name: Staging gate, and production unchanged
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User"(id, email, "passwordHash", name, role) VALUES
            ('ci-admin', 'ci-admin@test', 'x', 'CI Admin', 'ADMIN'),
            ('ci-ref', 'ci-ref@test', 'x', 'CI Ref', 'REFEREE'),
            ('ci-gone', 'ci-gone@test', 'x', 'CI Gone', 'ADMIN');
          UPDATE "User" SET active = false WHERE id = 'ci-gone';
          INSERT INTO "AuthSession"(id, "userId", token, "expiresAt") VALUES
            ('s1', 'ci-admin', 'admintoken', now() + interval '1 day'),
            ('s2', 'ci-ref', 'reftoken', now() + interval '1 day'),
            ('s3', 'ci-admin', 'expiredtoken', now() - interval '1 day'),
            ('s4', 'ci-gone', 'inactivetoken', now() + interval '1 day');
          SQL
          common="--network host -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci"
          docker run -d --name stg $common -e PORT=3998 -e APP_URL=http://localhost:3998 -e APP_ENV=staging wagga-futsal:ci
          docker run -d --name prd $common -e PORT=3997 -e APP_URL=http://localhost:3997 wagga-futsal:ci
          for p in 3998 3997; do for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/api/health >/dev/null && break; sleep 2; done; done

          fails=0
          # expect <port> <path> <cookie-token|-> <status> <noindex yes|no> [location-suffix]
          expect() {
            local hdrs; hdrs=$(mktemp)
            local cookie=(); [ "$3" != "-" ] && cookie=(-H "Cookie: session=$3")
            local code; code=$(curl -s -o /dev/null -D "$hdrs" -w "%{http_code}" "${cookie[@]}" "http://127.0.0.1:$1$2")
            local robots=no; grep -qi '^x-robots-tag: noindex' "$hdrs" && robots=yes
            local loc; loc=$(grep -i '^location:' "$hdrs" | tr -d '\r' | awk '{print $2}')
            if [ "$code" = "$4" ] && [ "$robots" = "$5" ] && { [ -z "${6:-}" ] || [[ "$loc" == *"$6" ]]; }; then
              echo "ok   $1 $2 [$3] → $code noindex=$robots $loc"
            else
              echo "FAIL $1 $2 [$3] → $code noindex=$robots $loc (wanted $4 noindex=$5 ${6:-})"; fails=$((fails+1))
            fi
          }
          # staging: closed without a valid admin session
          expect 3998 / - 307 yes /referee/login
          expect 3998 /admin - 307 yes /referee/login
          expect 3998 /competition - 307 yes /referee/login
          expect 3998 /api/admin/competitions - 401 yes
          expect 3998 /api/teams/x/calendar - 401 yes
          expect 3998 / reftoken 307 yes /referee/login
          expect 3998 / expiredtoken 307 yes /referee/login
          expect 3998 / inactivetoken 307 yes /referee/login
          expect 3998 / not-a-real-token 307 yes /referee/login
          expect 3998 /api/admin/competitions reftoken 401 yes
          # staging: open paths
          expect 3998 /referee/login - 200 yes
          expect 3998 /api/health - 200 yes
          expect 3998 /logo.png - 200 yes
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"email":"nobody@test","password":"x"}' http://127.0.0.1:3998/api/auth/login)
          [ "$code" = "401" ] && echo "ok   3998 POST /api/auth/login reachable (bad login → 401)" || { echo "FAIL login route → $code"; fails=$((fails+1)); }
          # staging: an active admin gets everything
          expect 3998 / admintoken 200 yes
          expect 3998 /competition admintoken 200 yes
          expect 3998 /api/admin/competitions admintoken 200 yes
          # production: exactly as before, no gate, no noindex
          expect 3997 / - 200 no
          expect 3997 /competition - 200 no
          expect 3997 /referee/login - 200 no
          expect 3997 /api/health - 200 no
          expect 3997 /api/admin/competitions - 401 no
          expect 3997 /api/admin/competitions admintoken 200 no
          expect 3997 /api/teams/x/calendar - 404 no
          docker rm -f stg prd >/dev/null
          [ "$fails" = 0 ] || { echo "$fails gate check(s) failed"; exit 1; }

      # Hardening batch: nominations, referee logins, session tokens, referee data in fixture views.
      - name: Nominations, referee logins, sessions
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "Competition"(id, name, season, "ageGroup", status) VALUES ('cN', 'Nom Comp', '2026', 'U12', 'REGISTRATION') ON CONFLICT DO NOTHING;
          INSERT INTO "Team"(id, name, status) VALUES ('tPend', 'Pending Spam FC', 'PENDING'), ('tOk', 'Approved FC', 'APPROVED');
          INSERT INTO "User"(id, email, "passwordHash", name, role) VALUES ('ci-hist', 'ci-hist@test', 'x', 'Ref With Games', 'REFEREE');
          INSERT INTO "Referee"(id, "userId", bsb, "accountNumber", phone) VALUES ('rH', 'ci-hist', 'enc:v1:x:y:z', 'enc:v1:x:y:z', '0400 111 222');
          INSERT INTO "Fixture"(id, "competitionId", "homeTeamId", "awayTeamId", "scheduledAt", round, status, "fieldRefereeId", "updatedAt")
            VALUES ('fH', 'cN', 'tOk', 'tPend', now(), 1, 'COMPLETED', 'rH', now());
          SQL
          docker run -d --name prd5 --network host -e PORT=3993 -e APP_URL=http://localhost:3993 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3993/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3993; J="Content-Type: application/json"; fails=0
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          is() { if [ "$2" = "$1" ]; then echo "ok   $3 → $2"; else echo "FAIL $3 → $2 (wanted $1)"; fails=$((fails+1)); fi; }
          # nominations
          is 400 "$(code -H "$J" -d '{"teamName":"X","competitionId":"cN","contactName":"Y","contactEmail":"not-an-email"}' $B/api/public/team-nomination)" "nomination with a bad email refused"
          is 400 "$(code -H "$J" -d '{"teamName":"X","competitionId":"cN","contactName":"Y","contactEmail":"a@b.com","kitShirt":{"x":1}}' $B/api/public/team-nomination)" "nomination with a non-text field refused"
          is 404 "$(code $B/teams/tPend)" "pending team page is not public"
          is 200 "$(code $B/teams/tOk)"   "approved team page is public"
          # referee logins need MANAGE_USERS; no password hash in the response
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{}' WHERE id='ci-admin'"
          is 401 "$(code -H "$J" -H 'Cookie: session=admintoken' -d '{"name":"R","email":"r.one","password":"long-enough-pw"}' $B/api/admin/referees)" "admin without Manage users can't create logins"
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS}' WHERE id='ci-admin'"
          is 400 "$(code -H "$J" -H 'Cookie: session=admintoken' -d '{"name":"R","email":"r.one","password":"short"}' $B/api/admin/referees)" "short referee password refused"
          r=$(curl -s -H "$J" -H 'Cookie: session=admintoken' -d '{"name":"R One","email":"R.One","password":"long-enough-pw"}' $B/api/admin/referees)
          echo "$r" | grep -q '"email":"r.one"' && ! echo "$r" | grep -q passwordHash && echo "ok   referee created (email lowercased, no password hash returned)" || { echo "FAIL create response: $r"; fails=$((fails+1)); }
          r=$(curl -s -X DELETE -H 'Cookie: session=admintoken' $B/api/admin/referees/rH)
          echo "$r" | grep -q '"deactivated":true' && echo "ok   referee with games is deactivated, not deleted" || { echo "FAIL delete with history: $r"; fails=$((fails+1)); }
          [ "$(psql "$DB" -tAc "SELECT count(*) FROM \"Referee\" WHERE id='rH'")" = 1 ] || { echo "FAIL referee with history was deleted"; fails=$((fails+1)); }
          # fixture admin views: names only (no bank fields, no phone)
          body=$(curl -s -H 'Cookie: session=admintoken' $B/api/admin/fixtures)
          echo "$body" | grep -qE '"bsb"|"accountNumber"|"accountName"|"phone"|enc:v1' && { echo "FAIL fixture list exposes referee details"; fails=$((fails+1)); } || echo "ok   fixture list has referee names only"
          # session tokens: a real sign-in issues a 256-bit random token
          r=$(curl -s -c /tmp/c5 -H "$J" -d '{"email":"r.one","password":"long-enough-pw"}' $B/api/auth/login)
          t=$(awk '$6=="session"{print $7}' /tmp/c5)
          [[ "$t" =~ ^[A-Za-z0-9_-]{43}$ ]] && echo "ok   session token is 256-bit random" || { echo "FAIL session token looks like: ${t:0:8}… ($r)"; fails=$((fails+1)); }
          docker rm -f prd5 >/dev/null
          [ "$fails" = 0 ] || exit 1

      - name: Payroll permission (and the previous release can still read it)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          fails=0
          # The grant migration: Manage-users admins get payroll; re-running adds no duplicates.
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "User"(id, email, "passwordHash", name, role, permissions) VALUES
            ('ci-pay1', 'ci-pay1@test', 'x', 'Users Admin', 'ADMIN', '{MANAGE_USERS}'),
            ('ci-pay2', 'ci-pay2@test', 'x', 'Plain Admin', 'ADMIN', '{VIEW_AUDIT}');
          SQL
          psql "$DB" -v ON_ERROR_STOP=1 -q -f prisma/manual-migrations/20261011c_grant_payroll.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f prisma/manual-migrations/20261011c_grant_payroll.sql
          got=$(psql "$DB" -tAc "SELECT id || '=' || array_to_string(permissions, ',') FROM \"User\" WHERE id IN ('ci-pay1','ci-pay2') ORDER BY id" | tr '\n' ' ')
          [ "$got" = "ci-pay1=MANAGE_USERS,MANAGE_PAYROLL ci-pay2=VIEW_AUDIT " ] && echo "ok   grant: $got" || { echo "FAIL grant: $got"; fails=$((fails+1)); }
          # Automatic rollback runs the previous release against this schema: its
          # Prisma client must still load users who hold the new permission.
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE" && git worktree add -q /tmp/base FETCH_HEAD
            (cd /tmp/base && npm ci --no-audit --no-fund --loglevel=error >/dev/null && npx prisma generate >/dev/null \
              && printf '%s\n' 'import { prisma } from "./lib/prisma";' \
                 'const u = await prisma.user.findUnique({ where: { id: "ci-pay1" }, select: { permissions: true } });' \
                 'console.log(JSON.stringify(u));' 'await prisma.$disconnect();' > oldread.mts \
              && DATABASE_URL="$DB" npx tsx oldread.mts) > /tmp/oldread.out 2>&1
            grep -q '"permissions":\[' /tmp/oldread.out && echo "ok   $BASE's Prisma client reads the new permission: $(tail -1 /tmp/oldread.out)" || { echo "FAIL $BASE's client can't read it:"; tail -20 /tmp/oldread.out; fails=$((fails+1)); }
          fi
          docker run -d --name prd6 --network host -e PORT=3992 -e APP_URL=http://localhost:3992 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3992/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3992; J="Content-Type: application/json"; A='Cookie: session=admintoken'
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          is() { if [ "$2" = "$1" ]; then echo "ok   $3 → $2"; else echo "FAIL $3 → $2 (wanted $1)"; fails=$((fails+1)); fi; }
          rates='{"fieldRefCents":5000,"scorerCents":2500,"fieldRefSeniorCents":6000,"scorerSeniorCents":3000}'
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS}' WHERE id='ci-admin'"
          is 401 "$(code -H "$A" "$B/api/admin/payroll?from=2026-01-01&to=2026-12-31")" "payroll summary without Manage payroll"
          is 401 "$(code -X PATCH -H "$A" -H "$J" -d "$rates" $B/api/admin/payroll)" "rate change without Manage payroll"
          is 401 "$(code -H "$A" -H "$J" -d '{"from":"2026-01-01","to":"2026-12-31","orgBsb":"1","orgAccount":"1","orgName":"x","orgBank":"WBC","orgApcaId":"1"}' $B/api/admin/payroll)" "ABA export without Manage payroll"
          is 401 "$(code -X PATCH -H "$A" -H "$J" -d '{"bsb":"062-000","accountNumber":"12345678","accountName":"Someone Else"}' $B/api/admin/referees/rH)" "bank-detail change without Manage payroll"
          is 307 "$(code -H "$A" $B/admin/payroll)" "payroll page sends them back to the dashboard"
          page=$(curl -s -H "$A" $B/admin/referees)
          echo "$page" | grep -q 'Change bank details\|Add bank details' && { echo "FAIL referees page offers bank editing"; fails=$((fails+1)); } || echo "ok   referees page has no bank editing"
          curl -s -H "$A" $B/admin | grep -q 'href="/admin/payroll"' && { echo "FAIL Payroll in the nav"; fails=$((fails+1)); } || echo "ok   no Payroll in the nav"
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS,MANAGE_PAYROLL}' WHERE id='ci-admin'"
          is 200 "$(code -H "$A" "$B/api/admin/payroll?from=2026-01-01&to=2026-12-31")" "payroll summary with Manage payroll"
          is 200 "$(code -H "$A" $B/admin/payroll)" "payroll page with Manage payroll"
          curl -s -H "$A" $B/admin | grep -q 'href="/admin/payroll"' && echo "ok   Payroll in the nav" || { echo "FAIL no Payroll in the nav"; fails=$((fails+1)); }
          curl -s -H "$A" $B/admin/referees | grep -q 'Change bank details\|Add bank details' && echo "ok   referees page offers bank editing" || { echo "FAIL no bank editing with the permission"; fails=$((fails+1)); }
          is 400 "$(code -X PATCH -H "$A" -H "$J" -d '{"fieldRefCents":-500,"scorerCents":2500,"fieldRefSeniorCents":6000,"scorerSeniorCents":3000}' $B/api/admin/payroll)" "negative rate refused"
          is 400 "$(code -X PATCH -H "$A" -H "$J" -d '{"fieldRefCents":50.5,"scorerCents":2500,"fieldRefSeniorCents":6000,"scorerSeniorCents":3000}' $B/api/admin/payroll)" "fractional cents refused"
          is 200 "$(code -X PATCH -H "$A" -H "$J" -d "$rates" $B/api/admin/payroll)" "valid rates saved"
          docker rm -f prd6 >/dev/null
          [ "$fails" = 0 ] || exit 1
