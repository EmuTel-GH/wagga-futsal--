# Required check for merging into develop and main (the ruleset looks for a job named "ci").
name: ci
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (incl. migration runner against Postgres)
        run: npm test

      - uses: docker/setup-buildx-action@v3
      - name: Docker build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: wagga-futsal:ci
          build-args: |
            APP_VERSION=ci
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rebuild what the server has (the target branch's schema, with its
      # migrations recorded as applied), run THIS image's migration step on it
      # exactly as the deployer would, then check the result matches this PR's
      # schema.prisma. Proves pg resolves in the standalone image, new
      # migration files apply cleanly, and they produce the declared schema.
      - name: Migrations apply on the deployed shape and match schema.prisma
        env:
          BASE: ${{ github.base_ref }}
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/prodshape
        run: |
          psql "postgresql://postgres:ci@localhost:5432/postgres" -c "CREATE DATABASE prodshape"
          git fetch --depth=1 origin "$BASE"
          git worktree add /tmp/base FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/base/node_modules
          (cd /tmp/base && npx prisma db push)
          MIGRATIONS_DIR=/tmp/base/prisma/manual-migrations node scripts/migrate.mjs --baseline-all
          out=$(docker run --rm --network host -e DATABASE_URL="postgresql://postgres:ci@127.0.0.1:5432/prodshape" wagga-futsal:ci node scripts/migrate.mjs)
          echo "$out"
          for f in $(comm -13 <(ls /tmp/base/prisma/manual-migrations/*.sql | xargs -n1 basename | sort) <(ls prisma/manual-migrations/*.sql | xargs -n1 basename | sort)); do
            echo "$out" | grep -q "applying $f" || { echo "expected $f to be applied"; exit 1; }
          done
          again=$(docker run --rm --network host -e DATABASE_URL="postgresql://postgres:ci@127.0.0.1:5432/prodshape" wagga-futsal:ci node scripts/migrate.mjs)
          echo "$again" | grep -q "up to date"
          # The runner's own bookkeeping table isn't in schema.prisma; set it
          # aside for the comparison (this is a throwaway CI database).
          psql "$DATABASE_URL" -qc 'CREATE SCHEMA ci_aside; ALTER TABLE "_app_migrations" SET SCHEMA ci_aside' 
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code \
            || { echo "The database after migrations doesn't match schema.prisma: a migration file is missing or wrong"; exit 1; }

      - name: Image serves /api/health
        run: |
          docker run -d --name app --network host -e PORT=3999 -e DATABASE_URL="postgresql://postgres:ci@127.0.0.1:5432/prodshape" -e STRIPE_SECRET_KEY=sk_test_ci -e APP_URL=http://localhost:3999 wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3999/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:3999/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:3999/api/health | grep -q '"version":"ci"'
          docker rm -f app

      # Staging gate (proxy.ts): with APP_ENV=staging only an active ADMIN's
      # real session gets in; production must behave exactly as before.
      - name: Staging gate, and production unchanged
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User"(id, email, "passwordHash", name, role) VALUES
            ('ci-admin', 'ci-admin@test', 'x', 'CI Admin', 'ADMIN'),
            ('ci-ref', 'ci-ref@test', 'x', 'CI Ref', 'REFEREE'),
            ('ci-gone', 'ci-gone@test', 'x', 'CI Gone', 'ADMIN');
          UPDATE "User" SET active = false WHERE id = 'ci-gone';
          INSERT INTO "AuthSession"(id, "userId", token, "expiresAt") VALUES
            ('s1', 'ci-admin', 'admintoken', now() + interval '1 day'),
            ('s2', 'ci-ref', 'reftoken', now() + interval '1 day'),
            ('s3', 'ci-admin', 'expiredtoken', now() - interval '1 day'),
            ('s4', 'ci-gone', 'inactivetoken', now() + interval '1 day');
          SQL
          common="--network host -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci"
          docker run -d --name stg $common -e PORT=3998 -e APP_URL=http://localhost:3998 -e APP_ENV=staging wagga-futsal:ci
          docker run -d --name prd $common -e PORT=3997 -e APP_URL=http://localhost:3997 wagga-futsal:ci
          for p in 3998 3997; do for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/api/health >/dev/null && break; sleep 2; done; done

          fails=0
          # expect <port> <path> <cookie-token|-> <status> <noindex yes|no> [location-suffix]
          expect() {
            local hdrs; hdrs=$(mktemp)
            local cookie=(); [ "$3" != "-" ] && cookie=(-H "Cookie: session=$3")
            local code; code=$(curl -s -o /dev/null -D "$hdrs" -w "%{http_code}" "${cookie[@]}" "http://127.0.0.1:$1$2")
            local robots=no; grep -qi '^x-robots-tag: noindex' "$hdrs" && robots=yes
            local loc; loc=$(grep -i '^location:' "$hdrs" | tr -d '\r' | awk '{print $2}')
            if [ "$code" = "$4" ] && [ "$robots" = "$5" ] && { [ -z "${6:-}" ] || [[ "$loc" == *"$6" ]]; }; then
              echo "ok   $1 $2 [$3] → $code noindex=$robots $loc"
            else
              echo "FAIL $1 $2 [$3] → $code noindex=$robots $loc (wanted $4 noindex=$5 ${6:-})"; fails=$((fails+1))
            fi
          }
          # staging: closed without a valid admin session
          expect 3998 / - 307 yes /referee/login
          expect 3998 /admin - 307 yes /referee/login
          expect 3998 /competition - 307 yes /referee/login
          expect 3998 /api/admin/competitions - 401 yes
          expect 3998 /api/teams/x/calendar - 401 yes
          expect 3998 / reftoken 307 yes /referee/login
          expect 3998 / expiredtoken 307 yes /referee/login
          expect 3998 / inactivetoken 307 yes /referee/login
          expect 3998 / not-a-real-token 307 yes /referee/login
          expect 3998 /api/admin/competitions reftoken 401 yes
          # staging: open paths
          expect 3998 /referee/login - 200 yes
          expect 3998 /api/health - 200 yes
          expect 3998 /logo.png - 200 yes
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"email":"nobody@test","password":"x"}' http://127.0.0.1:3998/api/auth/login)
          [ "$code" = "401" ] && echo "ok   3998 POST /api/auth/login reachable (bad login → 401)" || { echo "FAIL login route → $code"; fails=$((fails+1)); }
          # staging: an active admin gets everything
          expect 3998 / admintoken 200 yes
          expect 3998 /competition admintoken 200 yes
          expect 3998 /api/admin/competitions admintoken 200 yes
          # production: exactly as before, no gate, no noindex
          expect 3997 / - 200 no
          expect 3997 /competition - 200 no
          expect 3997 /referee/login - 200 no
          expect 3997 /api/health - 200 no
          expect 3997 /api/admin/competitions - 401 no
          expect 3997 /api/admin/competitions admintoken 200 no
          expect 3997 /api/teams/x/calendar - 404 no
          docker rm -f stg prd >/dev/null
          [ "$fails" = 0 ] || { echo "$fails gate check(s) failed"; exit 1; }

      # Only the assigned referee/scorer (or an admin) can change a fixture.
      - name: Fixture scoring permissions
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "User"(id, email, "passwordHash", name, role) VALUES ('ci-ref2', 'ci-ref2@test', 'x', 'CI Ref Two', 'REFEREE');
          INSERT INTO "AuthSession"(id, "userId", token, "expiresAt") VALUES ('s5', 'ci-ref2', 'ref2token', now() + interval '1 day');
          INSERT INTO "Referee"(id, "userId") VALUES ('r1', 'ci-ref'), ('r2', 'ci-ref2');
          INSERT INTO "Competition"(id, name, season, "ageGroup") VALUES ('c1', 'CI Comp', '2026', 'U12');
          INSERT INTO "Team"(id, name) VALUES ('tH', 'Home FC'), ('tA', 'Away FC'), ('tX', 'Other FC');
          INSERT INTO "Fixture"(id, "competitionId", "homeTeamId", "awayTeamId", "scheduledAt", round, status, "fieldRefereeId", "updatedAt")
            VALUES ('f1', 'c1', 'tH', 'tA', now(), 1, 'SCHEDULED', 'r1', now());
          SQL
          docker run -d --name prd3 --network host -e PORT=3995 -e APP_URL=http://localhost:3995 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3995/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3995; J="Content-Type: application/json"
          fails=0
          # code <curl args...> → HTTP status only (args passed as an array: no word splitting)
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          st() { code -X PATCH -H "$J" -H "Cookie: session=$1" -d "{\"status\":\"$2\"}" "$B/api/fixtures/f1/status"; }
          ev() { code -X POST -H "$J" -H "Cookie: session=$1" -d "{\"teamId\":\"$2\",\"type\":\"GOAL\",\"minute\":5,\"half\":1}" "$B/api/fixtures/f1/events"; }
          page() { code -H "Cookie: session=$1" "$B/referee/games/f1/score"; }
          is() { if [ "$2" = "$1" ]; then echo "ok   $3 → $2"; else echo "FAIL $3 → $2 (wanted $1)"; fails=$((fails+1)); fi; }
          is 403 "$(st ref2token LIVE)"       "other referee can't start the game"
          is 403 "$(ev ref2token tH)"         "other referee can't add a goal"
          is 404 "$(page ref2token)"          "other referee can't open the scorer page"
          is 200 "$(page reftoken)"           "assigned referee opens the scorer page"
          is 200 "$(st reftoken LIVE)"        "assigned referee starts the game"
          is 400 "$(ev reftoken tX)"          "goal for a team that isn't playing"
          is 201 "$(ev reftoken tH)"          "assigned referee adds a goal"
          is 200 "$(st reftoken COMPLETED)"   "assigned referee completes the game"
          is 403 "$(st reftoken LIVE)"        "referee can't reopen a finished game"
          is 403 "$(ev reftoken tA)"          "referee can't add to a finished game"
          is 200 "$(st admintoken LIVE)"      "admin can still correct a finished game"
          docker rm -f prd3 >/dev/null
      # Public match pages and the scorer page must not expose team contacts,
      # fixture notes, referee ids or players' dates of birth / registration ids.
      - name: No personal data on match pages
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "Competition"(id, name, season, "ageGroup") VALUES ('c9', 'Leak Comp', '2026', 'U12') ON CONFLICT DO NOTHING;
          INSERT INTO "Team"(id, name, "contactName", "contactEmail", "contactPhone") VALUES
            ('tL1', 'Leak Home', 'Parent Name', 'parent-secret@example.test', '0400 000 999'),
            ('tL2', 'Leak Away', 'Other Parent', 'other-secret@example.test', '0400 000 888');
          INSERT INTO "Player"(id, "firstName", "lastName", "dateOfBirth", gender, "playFootballId") VALUES ('pL', 'Kid', 'Player', '2015-03-07', 'MALE', 'PF-SECRET-123');
          INSERT INTO "TeamPlayer"(id, "teamId", "playerId", "jerseyNumber") VALUES ('tpL', 'tL1', 'pL', 7);
          INSERT INTO "Fixture"(id, "competitionId", "homeTeamId", "awayTeamId", "scheduledAt", round, status, notes, "updatedAt")
            VALUES ('fL', 'c9', 'tL1', 'tL2', now(), 1, 'LIVE', 'internal-note-SECRET', now());
          INSERT INTO "MatchEvent"(id, "fixtureId", "teamId", type, minute, "playerName") VALUES ('eL', 'fL', 'tL1', 'GOAL', 3, 'Kid Player');
          SQL
          docker run -d --name prd4 --network host -e PORT=3994 -e APP_URL=http://localhost:3994 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3994/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3994
          leaks='parent-secret|other-secret|0400 000|Parent Name|internal-note-SECRET|PF-SECRET|2015-03-07|dateOfBirth|playFootballId|contactEmail|fieldRefereeId|scorerId'
          fails=0
          for what in "/api/fixtures/fL" "/live/fL" "/referee/games/fL/score"; do
            body=$(curl -s -H "Cookie: session=admintoken" "$B$what")
            echo "$body" | grep -q "Leak Home" || { echo "FAIL $what didn't render the fixture"; fails=$((fails+1)); continue; }
            found=$(echo "$body" | grep -oE "$leaks" | sort -u | tr '\n' ' ')
            if [ -n "$found" ]; then echo "FAIL $what exposes: $found"; fails=$((fails+1)); else echo "ok   $what shows the match without personal data"; fi
          done
          curl -s "$B/api/fixtures/fL" | grep -q '"name":"Leak Home"' && echo "ok   API still has what the live page needs" || { echo "FAIL API lost team names"; fails=$((fails+1)); }
          docker rm -f prd4 >/dev/null
      # Hardening batch: nominations, referee logins, session tokens, referee data in fixture views.
      - name: Nominations, referee logins, sessions
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "Competition"(id, name, season, "ageGroup", status) VALUES ('cN', 'Nom Comp', '2026', 'U12', 'REGISTRATION') ON CONFLICT DO NOTHING;
          INSERT INTO "Team"(id, name, status) VALUES ('tPend', 'Pending Spam FC', 'PENDING'), ('tOk', 'Approved FC', 'APPROVED');
          INSERT INTO "User"(id, email, "passwordHash", name, role) VALUES ('ci-hist', 'ci-hist@test', 'x', 'Ref With Games', 'REFEREE');
          INSERT INTO "Referee"(id, "userId", bsb, "accountNumber", phone) VALUES ('rH', 'ci-hist', 'enc:v1:x:y:z', 'enc:v1:x:y:z', '0400 111 222');
          INSERT INTO "Fixture"(id, "competitionId", "homeTeamId", "awayTeamId", "scheduledAt", round, status, "fieldRefereeId", "updatedAt")
            VALUES ('fH', 'cN', 'tOk', 'tPend', now(), 1, 'COMPLETED', 'rH', now());
          SQL
          docker run -d --name prd5 --network host -e PORT=3993 -e APP_URL=http://localhost:3993 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3993/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3993; J="Content-Type: application/json"; fails=0
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          is() { if [ "$2" = "$1" ]; then echo "ok   $3 → $2"; else echo "FAIL $3 → $2 (wanted $1)"; fails=$((fails+1)); fi; }
          # nominations
          is 400 "$(code -H "$J" -d '{"teamName":"X","competitionId":"cN","contactName":"Y","contactEmail":"not-an-email"}' $B/api/public/team-nomination)" "nomination with a bad email refused"
          is 400 "$(code -H "$J" -d '{"teamName":"X","competitionId":"cN","contactName":"Y","contactEmail":"a@b.com","kitShirt":{"x":1}}' $B/api/public/team-nomination)" "nomination with a non-text field refused"
          is 404 "$(code $B/teams/tPend)" "pending team page is not public"
          is 200 "$(code $B/teams/tOk)"   "approved team page is public"
          # referee logins need MANAGE_USERS; no password hash in the response
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{}' WHERE id='ci-admin'"
          is 401 "$(code -H "$J" -H 'Cookie: session=admintoken' -d '{"name":"R","email":"r.one","password":"long-enough-pw"}' $B/api/admin/referees)" "admin without Manage users can't create logins"
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS}' WHERE id='ci-admin'"
          is 400 "$(code -H "$J" -H 'Cookie: session=admintoken' -d '{"name":"R","email":"r.one","password":"short"}' $B/api/admin/referees)" "short referee password refused"
          r=$(curl -s -H "$J" -H 'Cookie: session=admintoken' -d '{"name":"R One","email":"R.One","password":"long-enough-pw"}' $B/api/admin/referees)
          echo "$r" | grep -q '"email":"r.one"' && ! echo "$r" | grep -q passwordHash && echo "ok   referee created (email lowercased, no password hash returned)" || { echo "FAIL create response: $r"; fails=$((fails+1)); }
          r=$(curl -s -X DELETE -H 'Cookie: session=admintoken' $B/api/admin/referees/rH)
          echo "$r" | grep -q '"deactivated":true' && echo "ok   referee with games is deactivated, not deleted" || { echo "FAIL delete with history: $r"; fails=$((fails+1)); }
          [ "$(psql "$DB" -tAc "SELECT count(*) FROM \"Referee\" WHERE id='rH'")" = 1 ] || { echo "FAIL referee with history was deleted"; fails=$((fails+1)); }
          # fixture admin views: names only (no bank fields, no phone)
          body=$(curl -s -H 'Cookie: session=admintoken' $B/api/admin/fixtures)
          echo "$body" | grep -qE '"bsb"|"accountNumber"|"accountName"|"phone"|enc:v1' && { echo "FAIL fixture list exposes referee details"; fails=$((fails+1)); } || echo "ok   fixture list has referee names only"
          # session tokens: a real sign-in issues a 256-bit random token
          r=$(curl -s -c /tmp/c5 -H "$J" -d '{"email":"r.one","password":"long-enough-pw"}' $B/api/auth/login)
          t=$(awk '$6=="session"{print $7}' /tmp/c5)
          [[ "$t" =~ ^[A-Za-z0-9_-]{43}$ ]] && echo "ok   session token is 256-bit random" || { echo "FAIL session token looks like: ${t:0:8}… ($r)"; fails=$((fails+1)); }
          docker rm -f prd5 >/dev/null
          [ "$fails" = 0 ] || exit 1
      # One-time password set-up links (replacing username-only first sign-in).
      - name: Account set-up links
        run: |
          docker run -d --name prd2 --network host -e PORT=3996 -e APP_URL=http://localhost:3996 -e DATABASE_URL=postgresql://postgres:ci@127.0.0.1:5432/prodshape -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3996/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3996; A="Cookie: session=admintoken"; J="Content-Type: application/json"
          psql postgresql://postgres:ci@127.0.0.1:5432/prodshape -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS}' WHERE id='ci-admin'"
          fail() { echo "FAIL: $*"; exit 1; }
          tok() { sed -n 's/.*token=\([A-Za-z0-9_-]*\).*/\1/p'; }
          login() { curl -s -o /tmp/l.json -w "%{http_code}" -H "$J" -d "{\"email\":\"$1\",\"password\":\"$2\"}" $B/api/auth/login; }
          setpw() { curl -s -o /tmp/s.json -w "%{http_code}" -H "$J" -d "{\"token\":\"$1\",\"password\":\"$2\"}" $B/api/auth/set-password; }

          # A user created without a password gets a link, not a claimable account.
          r=$(curl -s -H "$A" -H "$J" -d '{"name":"New Ref","email":"new.ref","role":"REFEREE"}' $B/api/admin/users)
          echo "$r" | grep -q '"setupUrl":"http://localhost:3996/referee/login/setup?token=' || fail "no setup link: $r"
          T1=$(echo "$r" | tok); uid=$(echo "$r" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')

          # Login says the same thing for needs-setup, wrong password and unknown users.
          [ "$(login new.ref '')" = 400 ] || [ "$(login new.ref '')" = 401 ] || fail "blank password login"
          [ "$(login new.ref 'whatever-password')" = 401 ] || fail "needs-setup login status"; b1=$(cat /tmp/l.json)
          [ "$(login nobody.here 'whatever-password')" = 401 ] || fail "unknown login status"; b2=$(cat /tmp/l.json)
          [ "$(login ci-admin@test 'wrong-password')" = 401 ] || fail "wrong password status"; b3=$(cat /tmp/l.json)
          [ "$b1" = "$b2" ] && [ "$b2" = "$b3" ] || fail "login responses differ: $b1 / $b2 / $b3"
          echo "ok   needs-setup, unknown and wrong-password logins are indistinguishable"

          # Only the hash is stored.
          [ "$(psql postgresql://postgres:ci@127.0.0.1:5432/prodshape -tAc "SELECT count(*) FROM \"PasswordSetupToken\" WHERE \"tokenHash\"='$T1'")" = 0 ] || fail "raw token stored"

          [ "$(setpw not-a-token 'long-enough-password')" = 400 ] || fail "bad token accepted"
          [ "$(setpw "$T1" 'short')" = 400 ] || fail "short password accepted"
          [ "$(setpw "$T1" 'long-enough-password')" = 200 ] || fail "valid link refused: $(cat /tmp/s.json)"
          [ "$(setpw "$T1" 'another-long-password')" = 400 ] || fail "link worked twice"
          [ "$(login new.ref 'long-enough-password')" = 200 ] || fail "can't sign in with the new password"
          echo "ok   link sets the password once, then the account signs in normally"

          # A new link replaces the old one; expired links fail.
          T2=$(curl -s -X POST -H "$A" $B/api/admin/users/$uid/setup-link | tok)
          T3=$(curl -s -X POST -H "$A" $B/api/admin/users/$uid/setup-link | tok)
          [ "$(setpw "$T2" 'long-enough-password-2')" = 400 ] || fail "old link still works after a new one"
          psql postgresql://postgres:ci@127.0.0.1:5432/prodshape -qc "UPDATE \"PasswordSetupToken\" SET \"expiresAt\" = now() - interval '1 minute'"
          [ "$(setpw "$T3" 'long-enough-password-3')" = 400 ] || fail "expired link accepted"
          echo "ok   new link invalidates the old; expired links fail"

          # Clearing a password returns a link; non-admins can't make links.
          curl -s -X PATCH -H "$A" -H "$J" -d '{"requirePasswordSetup":true}' $B/api/admin/users/$uid | grep -q '"setupUrl"' || fail "reset gives no link"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Cookie: session=reftoken' $B/api/admin/users/$uid/setup-link)" = 401 ] || fail "referee made a link"
          echo "ok   reset returns a link; only user managers can make links"
          docker rm -f prd2 >/dev/null

      - name: Payroll permission (and the previous release still reads every user)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          fails=0
          psql "$DB" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "User"(id, email, "passwordHash", name, role, permissions) VALUES
            ('ci-pay1', 'ci-pay1@test', 'x', 'Users Admin', 'ADMIN', '{MANAGE_USERS}');
          SQL
          # This release's migrations add MANAGE_PAYROLL but give it to nobody yet.
          n=$(psql "$DB" -tAc "SELECT count(*) FROM \"User\" WHERE 'MANAGE_PAYROLL' = ANY(permissions)")
          [ "$n" = 0 ] && echo "ok   nobody holds MANAGE_PAYROLL after migrating" || { echo "FAIL $n user(s) hold MANAGE_PAYROLL after migrating"; fails=$((fails+1)); }
          # Automatic rollback runs the previous release against this schema: its
          # Prisma client must still load every user (it throws on enum values it doesn't know).
          # (Own worktree and install: the migration step's /tmp/base shares this branch's client.)
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE" && git worktree add -q /tmp/prev FETCH_HEAD
            (cd /tmp/prev && npm ci --no-audit --no-fund --loglevel=error >/dev/null && npx prisma generate >/dev/null \
              && printf '%s\n' 'import { prisma } from "./lib/prisma";' \
                 'const u = await prisma.user.findMany({ select: { id: true, permissions: true } });' \
                 'console.log(JSON.stringify(u));' 'await prisma.$disconnect();' > oldread.mts \
              && DATABASE_URL="$DB" npx tsx oldread.mts) > /tmp/oldread.out 2>&1 || true
            grep -q '"permissions":\[' /tmp/oldread.out && echo "ok   $BASE's Prisma client still reads every user after these migrations" || { echo "FAIL $BASE's client can't read it:"; tail -20 /tmp/oldread.out; fails=$((fails+1)); }
          fi
          docker run -d --name prd6 --network host -e PORT=3992 -e APP_URL=http://localhost:3992 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3992/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3992; J="Content-Type: application/json"; A='Cookie: session=admintoken'
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          is() { if [ "$2" = "$1" ]; then echo "ok   $3 → $2"; else echo "FAIL $3 → $2 (wanted $1)"; fails=$((fails+1)); fi; }
          rates='{"fieldRefCents":5000,"scorerCents":2500,"fieldRefSeniorCents":6000,"scorerSeniorCents":3000}'
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS}' WHERE id='ci-admin'"
          is 401 "$(code -H "$A" "$B/api/admin/payroll?from=2026-01-01&to=2026-12-31")" "payroll summary without Manage payroll"
          is 401 "$(code -X PATCH -H "$A" -H "$J" -d "$rates" $B/api/admin/payroll)" "rate change without Manage payroll"
          is 401 "$(code -H "$A" -H "$J" -d '{"from":"2026-01-01","to":"2026-12-31","orgBsb":"1","orgAccount":"1","orgName":"x","orgBank":"WBC","orgApcaId":"1"}' $B/api/admin/payroll)" "ABA export without Manage payroll"
          is 401 "$(code -X PATCH -H "$A" -H "$J" -d '{"bsb":"062-000","accountNumber":"12345678","accountName":"Someone Else"}' $B/api/admin/referees/rH)" "bank-detail change without Manage payroll"
          is 307 "$(code -H "$A" $B/admin/payroll)" "payroll page sends them back to the dashboard"
          page=$(curl -s -H "$A" $B/admin/referees)
          echo "$page" | grep -q 'Change bank details\|Add bank details' && { echo "FAIL referees page offers bank editing"; fails=$((fails+1)); } || echo "ok   referees page has no bank editing"
          curl -s -H "$A" $B/admin | grep -q 'href="/admin/payroll"' && { echo "FAIL Payroll in the nav"; fails=$((fails+1)); } || echo "ok   no Payroll in the nav"
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS,MANAGE_PAYROLL}' WHERE id='ci-admin'"
          is 200 "$(code -H "$A" "$B/api/admin/payroll?from=2026-01-01&to=2026-12-31")" "payroll summary with Manage payroll"
          is 200 "$(code -H "$A" $B/admin/payroll)" "payroll page with Manage payroll"
          curl -s -H "$A" $B/admin | grep -q 'href="/admin/payroll"' && echo "ok   Payroll in the nav" || { echo "FAIL no Payroll in the nav"; fails=$((fails+1)); }
          curl -s -H "$A" $B/admin/referees | grep -q 'Change bank details\|Add bank details' && echo "ok   referees page offers bank editing" || { echo "FAIL no bank editing with the permission"; fails=$((fails+1)); }
          is 400 "$(code -X PATCH -H "$A" -H "$J" -d '{"fieldRefCents":-500,"scorerCents":2500,"fieldRefSeniorCents":6000,"scorerSeniorCents":3000}' $B/api/admin/payroll)" "negative rate refused"
          is 400 "$(code -X PATCH -H "$A" -H "$J" -d '{"fieldRefCents":50.5,"scorerCents":2500,"fieldRefSeniorCents":6000,"scorerSeniorCents":3000}' $B/api/admin/payroll)" "fractional cents refused"
          is 200 "$(code -X PATCH -H "$A" -H "$J" -d "$rates" $B/api/admin/payroll)" "valid rates saved"
          docker rm -f prd6 >/dev/null
          [ "$fails" = 0 ] || exit 1

      - name: Security headers, bookings off, no self-reset
        run: |
          DB=postgresql://postgres:ci@127.0.0.1:5432/prodshape
          docker run -d --name prd7 --network host -e PORT=3991 -e APP_URL=http://localhost:3991 -e DATABASE_URL=$DB -e STRIPE_SECRET_KEY=sk_test_ci wagga-futsal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3991/api/health >/dev/null && break; sleep 2; done
          B=http://127.0.0.1:3991; fails=0
          h=$(curl -s -D - -o /dev/null $B/ | tr -d '\r')
          for want in "strict-transport-security: max-age" "x-frame-options: DENY" "x-content-type-options: nosniff" "referrer-policy:" "content-security-policy: default-src 'self'"; do
            echo "$h" | grep -qi "^$want" && echo "ok   $want" || { echo "FAIL missing $want"; fails=$((fails+1)); }
          done
          echo "$h" | grep -qi "^x-powered-by" && { echo "FAIL x-powered-by is sent"; fails=$((fails+1)); } || echo "ok   no x-powered-by"
          for p in /api/sessions/x/book /api/webhooks/stripe; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' $B$p)
            [ "$c" = 404 ] && echo "ok   $p → 404 while bookings are off" || { echo "FAIL $p → $c"; fails=$((fails+1)); }
          done
          psql "$DB" -qc "UPDATE \"User\" SET permissions='{MANAGE_USERS}' WHERE id='ci-admin'"
          c=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH -H "Content-Type: application/json" -H 'Cookie: session=admintoken' -d '{"password":"a-long-enough-password"}' $B/api/admin/users/ci-admin)
          [ "$c" = 400 ] && echo "ok   admins can't reset their own password through user management" || { echo "FAIL self-reset → $c"; fails=$((fails+1)); }
          docker rm -f prd7 >/dev/null
          [ "$fails" = 0 ] || exit 1
