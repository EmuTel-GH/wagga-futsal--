# Point a channel (main = production, develop = staging) back at an older
# published version. The server then deploys it like any other version.
# The next merge moves the channel forward again, so follow up with a revert PR.
name: rollback
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to go back to (7-character short sha, as shown in the site footer)"
        required: true
        type: string
      channel:
        description: "Which site"
        required: true
        type: choice
        options: [main, develop]
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/emutel-gh/wagga-futsal
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version looks right
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9a-f]{7}$ ]] || { echo "version must be a 7-character short sha"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version exists in the registry
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null
      - name: Re-point the channel
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: docker buildx imagetools create -t "${IMAGE}:${CHANNEL}" "${IMAGE}:${VERSION}"
      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "\`${IMAGE}:${CHANNEL}\` now points at \`${VERSION}\`. The site switches within a few minutes (check the footer)." >> "$GITHUB_STEP_SUMMARY"
          echo "Follow up with a revert PR, or the next merge to ${CHANNEL} will move it forward again." >> "$GITHUB_STEP_SUMMARY"
